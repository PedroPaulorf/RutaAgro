spring.datasource.url=jdbc:postgresql://localhost:5432/rutaagro
spring.datasource.username=${RUTAAGRO_DB_USERNAME}
spring.datasource.password=${RUTAAGRO_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
